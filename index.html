<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flatline: a cyberpunk survival story</title>
    <meta
      name="description"
      content="A cyberpunk survival story in your browser. Six hours to live, a stolen chip in your spine, and a game that remembers every death."
    />
    <meta name="theme-color" content="#050505" />
    <meta name="color-scheme" content="dark" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- When a link is shared. The address comes from Netlify at build time (see vite.config.ts). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Flatline" />
    <meta property="og:title" content="Flatline: a cyberpunk survival story" />
    <meta
      property="og:description"
      content="Six hours to live, a stolen chip in your spine, and a game that remembers every death."
    />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:image" content="__SITE_URL__/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="FLATLINE in neon pink above two heartbeat lines, over a rainy city skyline at night." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Flatline: a cyberpunk survival story" />
    <meta
      name="twitter:description"
      content="Six hours to live, a stolen chip in your spine, and a game that remembers every death."
    />
    <meta name="twitter:image" content="__SITE_URL__/og-image.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=JetBrains+Mono:wght@400;700&family=Barlow+Condensed:wght@600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>Flatline is played in the browser and needs JavaScript turned on.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
