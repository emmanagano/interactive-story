[build]
  command = "npm run build"
  publish = "dist"

# Vite 8 needs a recent Node. Without this Netlify may pick an older default.
[build.environment]
  NODE_VERSION = "22"

# Everything under /assets has a hash in its name, so it can be cached for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The game talks to nobody but Google Fonts. These headers make the browser enforce that:
# scripts and images only from this site, styles and fonts also from Google Fonts, no framing.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; media-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
